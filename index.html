<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWMS - CRS EXAMINATION</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 850px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f7f9fc;
            color: #333;
        }
        .header {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border-top: 10px solid #1565c0;
        }
        h1 { color: #1565c0; margin: 0; font-size: 1.8em; }
        .timer-container {
            position: sticky;
            top: 10px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        #timer {
            background: #d32f2f;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.4em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .q-container {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid #1565c0;
        }
        .options label {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #f1f3f4;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options label:hover { background: #e3f2fd; }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        
        .ans-reveal {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
            border-radius: 6px;
            display: none;
        }
        
        button#submit-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 18px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 40px auto;
            font-weight: bold;
        }
        button#submit-btn:disabled { background: #90a4ae; cursor: not-allowed; }
        
        #result-box {
            display: none;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 4px solid #1565c0;
            margin-top: 30px;
        }
        .score-text { font-size: 3em; color: #1565c0; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
    <p><strong>TERM TWO EXAMINATION, 2025/2026 ACADEMIC SESSION</strong></p>
    <p>Class: Key Stage 2 (Year 2) | Subject: CHRISTIAN RELIGIOUS STUDIES</p>
    <p>Duration: 45 Minutes</p>
</div>

<div class="timer-container">
    <div id="timer">45:00</div>
</div>

<form id="crsForm"></form>

<button id="submit-btn" onclick="processCrsExam()">Submit Examination</button>

<div id="result-box">
    <h2>Exam Results</h2>
    <div class="score-text" id="finalScore">0 / 30</div>
    <p id="percentage" style="font-size: 1.2em;"></p>
    <p>Scroll down to review correct answers.</p>
</div>

<script>
const crsData = [
    { q: "Jesus was baptised in River ______.", o: ["Nile", "Jordan", "Tigris", "Euphrates"], c: 1, text: "Jordan" },
    { q: "Jesus was baptised by ______.", o: ["Moses", "John the Baptist", "Peter", "Elijah"], c: 1, text: "John the Baptist" },
    { q: "The Holy Spirit descended like a ______.", o: ["eagle", "dove", "bird", "cloud"], c: 1, text: "dove" },
    { q: "Jesus fasted for ______ days.", o: ["seven", "twelve", "forty", "thirty"], c: 2, text: "forty" },
    { q: "The devil asked Jesus to turn stones into ______.", o: ["fish", "bread", "gold", "water"], c: 1, text: "bread" },
    { q: "Jesus overcame temptation by using the ______ of God.", o: ["sword", "money", "Word", "stone"], c: 2, text: "Word" },
    { q: "Jesus said, “Peace be ______.”", o: ["strong", "still", "fast", "calm"], c: 1, text: "still" },
    { q: "Peter caught many fish because he ______ Jesus.", o: ["ignored", "obeyed", "left", "forgot"], c: 1, text: "obeyed" },
    { q: "Jesus turned water into ______.", o: ["milk", "wine", "oil", "juice"], c: 1, text: "wine" },
    { q: "Lazarus had been in the grave for ______ days.", o: ["two", "three", "four", "five"], c: 2, text: "four" },
    { q: "The paralysed man was lowered through the ______.", o: ["door", "window", "roof", "gate"], c: 2, text: "roof" },
    { q: "Jesus raised the widow’s son in ______.", o: ["Cana", "Nain", "Egypt", "Jerusalem"], c: 1, text: "Nain" },
    { q: "The prodigal son wasted his ______.", o: ["inheritance", "money", "clothes", "farm"], c: 0, text: "inheritance" },
    { q: "The father ______ the prodigal son.", o: ["punished", "forgave", "chased", "rejected"], c: 1, text: "forgave" },
    { q: "Zacchaeus climbed a ______ to see Jesus.", o: ["mountain", "tree", "house", "wall"], c: 1, text: "tree" },
    { q: "The seed in the parable represents God’s ______.", o: ["house", "money", "Word", "land"], c: 2, text: "Word" },
    { q: "The good soil represents people who ______ God’s Word.", o: ["ignore", "obey", "forget", "reject"], c: 1, text: "obey" },
    { q: "Five maidens were called ______.", o: ["foolish", "wise", "lazy", "wicked"], c: 1, text: "wise" },
    { q: "Love means having deep ______.", o: ["anger", "affection", "fear", "hatred"], c: 1, text: "affection" },
    { q: "God created us in His ______.", o: ["house", "image", "garden", "temple"], c: 1, text: "image" },
    { q: "The father sent his sons to work in the ______.", o: ["vineyard", "market", "river", "farm"], c: 0, text: "vineyard" },
    { q: "Lazarus was a ______ man.", o: ["rich", "poor", "king", "priest"], c: 1, text: "poor" },
    { q: "The Good Samaritan helped a wounded ______.", o: ["animal", "man", "child", "woman"], c: 1, text: "man" },
    { q: "To be merciful means to ______.", o: ["ignore", "help others", "shout", "complain"], c: 1, text: "help others" },
    { q: "A peacemaker helps people to ______.", o: ["fight", "quarrel", "settle", "argue"], c: 2, text: "settle" },
    { q: "Good behaviour makes God ______.", o: ["angry", "sad", "happy", "afraid"], c: 2, text: "happy" },
    { q: "When we forgive others, God will ______ us.", o: ["punish", "forgive", "ignore", "hate"], c: 1, text: "forgive" },
    { q: "Jesus chose ______ disciples.", o: ["ten", "twelve", "twenty", "thirty"], c: 1, text: "twelve" },
    { q: "The Kingdom of God means living the way ______ wants.", o: ["man", "God", "friends", "teachers"], c: 1, text: "God" },
    { q: "Jesus has power over ______.", o: ["nothing", "natural forces only", "sickness only", "natural forces, sickness and death"], c: 3, text: "natural forces, sickness and death" }
];

const form = document.getElementById('crsForm');
crsData.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'q-container';
    div.innerHTML = `
        <h3>${i + 1}. ${item.q}</h3>
        <div class="options">
            ${item.o.map((opt, idx) => `
                <label><input type="radio" name="crs${i}" value="${idx}"> ${String.fromCharCode(65 + idx)}. ${opt}</label>
            `).join('')}
        </div>
        <div class="ans-reveal" id="reveal-${i}">Correct Answer: "${item.text}"</div>
    `;
    form.appendChild(div);
});

let timeLeft = 45 * 60;
const timerDisplay = document.getElementById('timer');
const clock = setInterval(() => {
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (timeLeft <= 0) {
        clearInterval(clock);
        processCrsExam();
    }
    timeLeft--;
}, 1000);

function processCrsExam() {
    clearInterval(clock);
    document.getElementById('submit-btn').disabled = true;
    let score = 0;

    crsData.forEach((item, i) => {
        const selected = document.querySelector(`input[name="crs${i}"]:checked`);
        document.getElementById(`reveal-${i}`).style.display = 'block';
        if (selected && parseInt(selected.value) === item.c) {
            score++;
        }
    });

    document.getElementById('result-box').style.display = 'block';
    document.getElementById('finalScore').innerText = `${score} / 30`;
    document.getElementById('percentage').innerText = "Score: " + Math.round((score/30)*100) + "%";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>

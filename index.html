<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT - Mathematics Exam</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 800px; background: white; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .info-bar { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 20px; color: #d9534f; }
        .question-card { display: none; }
        .active { display: block; }
        .options { margin-top: 15px; }
        .option { display: block; padding: 10px; background: #e9ecef; margin-bottom: 5px; border-radius: 4px; cursor: pointer; }
        .option:hover { background: #dee2e6; }
        input[type="radio"] { margin-right: 10px; }
        .nav-btns { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; }
        button:disabled { background: #ccc; }
        #result-area { display: none; margin-top: 20px; }
        .review-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .correct-text { color: green; font-weight: bold; }
        #login-section { text-align: center; padding: 50px 0; }
        input[type="text"] { padding: 10px; width: 250px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <h2>ROYAL WUNDERKIND MODEL SCHOOL</h2>
        <p>TERM TWO EXAMINATION, 2025/2026 SESSION</p>
        <p>Subject: MATHEMATICS | Year: 2</p>
        <input type="text" id="candidateName" placeholder="Enter Your Full Name" required><br>
        <button onclick="startExam()">Start Examination</button>
    </div>

    <div id="exam-section" style="display:none;">
        <div class="header">
            <h3>ROYAL WUNDERKIND MODEL SCHOOL</h3>
            <p>Mathematics - Key Stage 1 (Year 2)</p>
        </div>

        <div class="info-bar">
            <span>Name: <span id="display-name"></span></span>
            <span>Time Left: <span id="timer">45:00</span></span>
        </div>

        <div id="question-container"></div>

        <div class="nav-btns">
            <button id="prevBtn" onclick="changeQuestion(-1)">Previous</button>
            <span id="q-number">Question 1 of 40</span>
            <button id="nextBtn" onclick="changeQuestion(1)">Next</button>
            <button id="submitBtn" onclick="submitExam()" style="display:none; background: #28a745;">Submit Exam</button>
        </div>
    </div>

    <div id="result-area">
        <h2 id="score-display"></h2>
        <hr>
        <h3>Review Correct Answers:</h3>
        <div id="review-list"></div>
        <button onclick="location.reload()" style="margin-top:20px;">Restart</button>
    </div>
</div>

<script>
    const questions = [
        { q: "3 × 6 = ______", a: "18", options: ["15", "18", "21", "24"] },
        { q: "4 × 7 = ______", a: "28", options: ["24", "26", "28", "30"] },
        { q: "5 × 8 = ______", a: "40", options: ["35", "40", "45", "50"] },
        { q: "6 × 7 = ______", a: "42", options: ["36", "40", "42", "48"] },
        { q: "8 × 4 = ______", a: "32", options: ["28", "30", "32", "36"] },
        { q: "7 × 5 = ______", a: "35", options: ["30", "32", "35", "40"] },
        { q: "4 × 6 = ______", a: "24", options: ["20", "22", "24", "26"] },
        { q: "8 × 7 = ______", a: "56", options: ["54", "56", "58", "60"] },
        { q: "3 × 9 = ______", a: "27", options: ["24", "27", "30", "33"] },
        { q: "6 × 8 = ______", a: "48", options: ["46", "48", "50", "52"] },
        { q: "245 + 130 = ______", a: "375", options: ["365", "375", "385", "395"] },
        { q: "520 + 280 = ______", a: "800", options: ["700", "750", "800", "820"] },
        { q: "684 − 235 = ______", a: "449", options: ["439", "449", "459", "469"] },
        { q: "900 − 475 = ______", a: "425", options: ["415", "425", "435", "445"] },
        { q: "350 + 275 = ______", a: "625", options: ["615", "620", "625", "630"] },
        { q: "780 − 260 = ______", a: "520", options: ["510", "520", "530", "540"] },
        { q: "72 ÷ 8 = ______", a: "9", options: ["7", "8", "9", "10"] },
        { q: "63 ÷ 7 = ______", a: "9", options: ["7", "8", "9", "10"] },
        { q: "48 ÷ 6 = ______", a: "8", options: ["6", "7", "8", "9"] },
        { q: "56 ÷ 7 = ______", a: "8", options: ["6", "7", "8", "9"] },
        { q: "Find the missing number: 5 + ___ = 18", a: "13", options: ["11", "12", "13", "14"] },
        { q: "Find the missing number: ___ − 15 = 20", a: "35", options: ["30", "35", "40", "45"] },
        { q: "₦200 + ₦150 = ______", a: "₦350", options: ["₦320", "₦330", "₦350", "₦360"] },
        { q: "₦500 − ₦250 = ______", a: "₦250", options: ["₦200", "₦230", "₦250", "₦270"] },
        { q: "₦100 + ₦450 = ______", a: "₦550", options: ["₦530", "₦540", "₦550", "₦560"] },
        { q: "How many days are in a week?", a: "7", options: ["5", "6", "7", "8"] },
        { q: "How many months are in a year?", a: "12", options: ["10", "11", "12", "13"] },
        { q: "Which month has 28 or 29 days?", a: "February", options: ["February", "March", "April", "June"] },
        { q: "How many days are in April?", a: "30", options: ["28", "29", "30", "31"] },
        { q: "How many days are in January?", a: "31", options: ["28", "29", "30", "31"] },
        { q: "½ of 20 = ______", a: "10", options: ["5", "10", "15", "20"] },
        { q: "⅓ of 30 = ______", a: "10", options: ["8", "9", "10", "12"] },
        { q: "2/3 of 30 = ______", a: "20", options: ["10", "15", "20", "25"] },
        { q: "¼ of 40 = ______", a: "10", options: ["5", "8", "10", "12"] },
        { q: "¾ of 20 = ______", a: "15", options: ["10", "12", "15", "18"] },
        { q: "Write in figures: Twenty-five", a: "25", options: ["15", "20", "25", "30"] },
        { q: "Write in figures: Forty-two", a: "42", options: ["24", "32", "42", "52"] },
        { q: "Write in figures: One hundred and ten", a: "110", options: ["100", "101", "110", "120"] },
        { q: "Write in figures: Seventy-five", a: "75", options: ["65", "70", "75", "85"] },
        { q: "Write in figures: Ninety-nine", a: "99", options: ["89", "90", "95", "99"] }
    ];

    let currentQ = 0;
    let timer;
    let timeLeft = 45 * 60; // 45 minutes

    function startExam() {
        const name = document.getElementById('candidateName').value;
        if(!name) return alert("Please enter your name");
        document.getElementById('display-name').innerText = name;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('exam-section').style.display = 'block';
        loadQuestions();
        startTimer();
    }

    function loadQuestions() {
        const container = document.getElementById('question-container');
        questions.forEach((item, index) => {
            let qDiv = document.createElement('div');
            qDiv.className = `question-card ${index === 0 ? 'active' : ''}`;
            qDiv.id = `q-${index}`;
            qDiv.innerHTML = `<p><strong>Question ${index + 1}:</strong> ${item.q}</p>
                <div class="options">
                    ${item.options.map(opt => `
                        <label class="option">
                            <input type="radio" name="q${index}" value="${opt}"> ${opt}
                        </label>
                    `).join('')}
                </div>`;
            container.appendChild(qDiv);
        });
    }

    function changeQuestion(dir) {
        document.getElementById(`q-${currentQ}`).classList.remove('active');
        currentQ += dir;
        document.getElementById(`q-${currentQ}`).classList.add('active');
        
        document.getElementById('prevBtn').disabled = currentQ === 0;
        document.getElementById('nextBtn').style.display = currentQ === questions.length - 1 ? 'none' : 'inline-block';
        document.getElementById('submitBtn').style.display = currentQ === questions.length - 1 ? 'inline-block' : 'none';
        document.getElementById('q-number').innerText = `Question ${currentQ + 1} of ${questions.length}`;
    }

    function startTimer() {
        timer = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if(timeLeft <= 0) { clearInterval(timer); submitExam(); }
            timeLeft--;
        }, 1000);
    }

    function submitExam() {
        clearInterval(timer);
        let score = 0;
        const reviewList = document.getElementById('review-list');
        
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if(selected && selected.value === item.a) score++;
            
            reviewList.innerHTML += `
                <div class="review-item">
                    <p>${index + 1}. ${item.q}</p>
                    <p class="correct-text">Correct Answer: ${item.a}</p>
                </div>`;
        });

        document.getElementById('exam-section').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('score-display').innerText = 
            `${document.getElementById('candidateName').value}, your score is: ${score} / ${questions.length}`;
    }
</script>

</body>
</html>

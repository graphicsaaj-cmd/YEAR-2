<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Term 2 Examination 2025/2026 Academic session | Key Stage One & Two </title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.5;
    }
    h1, h2 { text-align: center; color: #2c3e50; }
    #info, #quiz, #result { margin: 30px 0; }
    .timer {
      font-size: 1.4em;
      font-weight: bold;
      color: #d32f2f;
      text-align: center;
      margin: 15px 0;
    }
    .question {
      margin: 25px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .question h3 {
      margin-top: 0;
      color: #34495e;
    }
    label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
    }
    button {
      padding: 12px 24px;
      font-size: 1.1em;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
    }
    #startBtn { background: #27ae60; }
    #submitBtn { background: #e74c3c; }
    #downloadBtn { background: #3498db; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th { background: #ecf0f1; }
    .correct { background: #d4edda; color: #155724; }
    .wrong { background: #f8d7da; color: #721c24; }
    #nameInput {
      padding: 10px;
      font-size: 1.1em;
      width: 280px;
      margin: 10px;
    }
    .center { text-align: center; }
    .answer-text {
      font-weight: bold;
      color: #1e8449;
    }
  </style>
</head>
<body>
<h1>Term 2 Examination 2025/2026 Academic session | Subject: Digital Art </h1>
<h2>Objective Questions (30)</h2>
<h2>Key Stage One & Two</h2>

<div id="info" class="center">
  <label>Enter your full name:
    <input type="text" id="nameInput" placeholder="Your Name" required />
  </label>
  <button id="startBtn">Start Exam</button>
</div>

<div id="quiz" style="display:none;">
  <div class="timer">Time remaining: <span id="time">45:00</span></div>
 
  <form id="testForm">
    <!-- Questions will be inserted here by JavaScript -->
  </form>
  <div class="center">
    <button id="submitBtn">Submit Exam</button>
  </div>
</div>

<div id="result" style="display:none;">
  <h2>Examination Result</h2>
  <div id="summary"></div>
  <table id="correctionTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Your Answer</th>
        <th>Correct Answer</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="center">
    <button id="downloadBtn">Download Result (Text)</button>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
// DATA
// ──────────────────────────────────────────────
const questions = [
  { q: "A computer is an ______ device.", opts: ["A. wooden", "B. electronic", "C. plastic", "D. paper"], ans: "B" },
  { q: "A computer accepts data as ______. ", opts: ["A. output", "B. thinking", "C. input", "D. printing"], ans: "C" },
  { q: "The result a computer gives after processing is called ______. ", opts: ["A. input", "B. output", "C. typing", "D. drawing"], ans: "B" },
  { q: "The “brain” of the computer is called the ______. ", opts: ["A. Monitor", "B. Mouse", "C. CPU", "D. Speaker"], ans: "C" },
  { q: "The part of the computer that shows what we are doing is the ______. ", opts: ["A. Keyboard", "B. Monitor", "C. Mouse", "D. CPU"], ans: "B" },
  { q: "Which device is used for typing? ", opts: ["A. Mouse", "B. Speaker", "C. Keyboard", "D. Webcam"], ans: "C" },
  { q: "The mouse is mainly used for ______. ", opts: ["A. cooking", "B. clicking and selecting", "C. printing", "D. charging"], ans: "B" },
  { q: "Drawing and painting on a computer is done using ______. ", opts: ["A. hardware only", "B. paint apps", "C. cables", "D. printer"], ans: "B" },
  { q: "Hardware means parts you can ______. ", opts: ["A. eat", "B. see and touch", "C. download", "D. hear only"], ans: "B" },
  { q: "Which of these is hardware? ", opts: ["A. Windows", "B. Game", "C. Monitor", "D. Paint app"], ans: "C" },
  { q: "Which of these is software? ", opts: ["A. Mouse", "B. Keyboard", "C. Windows", "D. Speaker"], ans: "C" },
  { q: "The main program that controls the computer is called ______. ", opts: ["A. App", "B. Game", "C. Operating System", "D. Mouse"], ans: "C" },
  { q: "An example of an operating system is ______. ", opts: ["A. Speaker", "B. Windows", "C. Mouse", "D. Webcam"], ans: "B" },
  { q: "Software tells the computer what to ______. ", opts: ["A. eat", "B. draw", "C. do", "D. clean"], ans: "C" },
  { q: "The long key used for spacing words is the ______. ", opts: ["A. Enter Key", "B. Shift Key", "C. Space Bar", "D. Ctrl Key"], ans: "C" },
  { q: "The key used to move to a new line is the ______. ", opts: ["A. Backspace", "B. Enter Key", "C. Tab", "D. Alt"], ans: "B" },
  { q: "The key used to erase letters is the ______. ", opts: ["A. Caps Lock", "B. Shift", "C. Backspace", "D. Ctrl"], ans: "C" },
  { q: "Arrow keys are also called ______ keys. ", opts: ["A. Function", "B. Numeric", "C. Cursor", "D. Special"], ans: "C" },
  { q: "The part of the mouse used to move up and down a page is the ______. ", opts: ["A. Cable", "B. Scroll wheel", "C. LED light", "D. Button"], ans: "B" },
  { q: "The left button of a mouse is used to ______. ", opts: ["A. scroll", "B. left-click", "C. connect", "D. type"], ans: "B" },
  { q: "Right-clicking is often used to ______. ", opts: ["A. open more options", "B. shut down", "C. print", "D. type"], ans: "A" },
  { q: "Motion detection helps the mouse to ______. ", opts: ["A. shine", "B. connect", "C. track movement", "D. type"], ans: "C" },
  { q: "The wire that connects a wired mouse is called the ______. ", opts: ["A. sensor", "B. LED", "C. mouse cable", "D. screen"], ans: "C" },
  { q: "Computer hygiene means keeping the computer ______. ", opts: ["A. dirty", "B. hidden", "C. clean and safe", "D. open"], ans: "C" },
  { q: "Before using a computer, you should ______. ", opts: ["A. eat", "B. wash your hands", "C. run", "D. shout"], ans: "B" },
  { q: "We should not ______ near the computer. ", opts: ["A. type", "B. click", "C. eat or drink", "D. read"], ans: "C" },
  { q: "To protect the computer from viruses, avoid clicking ______. ", opts: ["A. learning apps", "B. strange links", "C. keyboard", "D. mouse"], ans: "B" },
  { q: "After using the computer, you should ______. ", opts: ["A. unplug it quickly", "B. hit it", "C. shut it down properly", "D. leave it on"], ans: "C" },
  { q: "Hardware and software work together like your ______. ", opts: ["A. shoes and socks", "B. body and mind", "C. bag and book", "D. food and plate"], ans: "B" },
  { q: "Keeping the computer clean helps it to ______. ", opts: ["A. break quickly", "B. last longer", "C. stop working", "D. disappear"], ans: "B" }
];

// Helper to get full answer text (e.g. "B – electronic")
function getAnswerText(index, letter) {
  const q = questions[index];
  const optIndex = letter.charCodeAt(0) - 65; // A→0, B→1, ...
  if (optIndex >= 0 && optIndex < q.opts.length) {
    return `${letter} – ${q.opts[optIndex].substring(3)}`; // remove "A. ", "B. " etc.
  }
  return letter;
}

const correctAnswers = questions.map(q => q.ans);

// ──────────────────────────────────────────────
// DOM Elements
// ──────────────────────────────────────────────
const startBtn = document.getElementById("startBtn");
const submitBtn = document.getElementById("submitBtn");
const nameInput = document.getElementById("nameInput");
const infoDiv = document.getElementById("info");
const quizDiv = document.getElementById("quiz");
const resultDiv = document.getElementById("result");
const form = document.getElementById("testForm");
const timeDisplay = document.getElementById("time");
const summaryDiv = document.getElementById("summary");
const tableBody = document.querySelector("#correctionTable tbody");

let timeLeft = 45 * 60; // 45 minutes in seconds
let timerId = null;
let studentName = "";

// ──────────────────────────────────────────────
// Generate questions
// ──────────────────────────────────────────────
function generateQuestions() {
  let html = "";
  questions.forEach((q, i) => {
    html += `<div class="question">
      <h3>${i+1}. ${q.q}</h3>`;
    q.opts.forEach((opt, j) => {
      const letter = String.fromCharCode(65 + j);
      html += `
        <label>
          <input type="radio" name="q${i}" value="${letter}" required>
          ${opt}
        </label>`;
    });
    html += `</div>`;
  });
  form.innerHTML = html;
}

// ──────────────────────────────────────────────
// Timer
// ──────────────────────────────────────────────
function updateTimer() {
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  timeDisplay.textContent = `${min}:${sec < 10 ? "0" : ""}${sec}`;
  if (timeLeft <= 0) {
    clearInterval(timerId);
    alert("Time is up! Submitting your answers...");
    submitExam();
  }
  timeLeft--;
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  timeLeft = 45 * 60;
  updateTimer();
  timerId = setInterval(updateTimer, 1000);
}

// ──────────────────────────────────────────────
// Submission & Scoring
// ──────────────────────────────────────────────
function submitExam() {
  clearInterval(timerId);
  const formData = new FormData(form);
  let score = 0;
  const results = [];

  questions.forEach((q, i) => {
    const selected = formData.get(`q${i}`);
    const correct = correctAnswers[i];
    const isCorrect = selected === correct;
    if (isCorrect) score++;

    results.push({
      num: i+1,
      selected: selected || "—",
      selectedText: selected ? getAnswerText(i, selected) : "—",
      correct: correct,
      correctText: getAnswerText(i, correct),
      status: isCorrect ? "Correct" : "Wrong"
    });
  });

  // Show result
  quizDiv.style.display = "none";
  resultDiv.style.display = "block";

  summaryDiv.innerHTML = `
    <p><strong>Candidate:</strong> ${studentName || "—"}</p>
    <p><strong>Score:</strong> ${score} / 30 (${Math.round(score/30*100)}%)</p>
  `;

  // Build correction table
  tableBody.innerHTML = "";
  results.forEach(r => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${r.num}</td>
      <td>${r.selectedText}</td>
      <td class="answer-text">${r.correctText}</td>
      <td class="${r.status === "Correct" ? "correct" : "wrong"}">${r.status}</td>
    `;
    tableBody.appendChild(row);
  });
}

// ──────────────────────────────────────────────
// Download simple text result
// ──────────────────────────────────────────────
function downloadResult() {
  const score = tableBody.querySelectorAll("tr .correct").length;
  let text = `Digital Art – Key Stage 2 | 2nd Term Exam Result\n\n`;
  text += `Candidate: ${studentName || "Not entered"}\n`;
  text += `Score: ${score} / 30 (${Math.round(score/30*100)}%)\n\n`;
  text += `Corrections:\n`;
  questions.forEach((q, i) => {
    const row = tableBody.rows[i];
    const yourAns = row.cells[1].textContent;
    const corrAns = row.cells[2].textContent;
    const status = row.cells[3].textContent;
    text += `${i+1}. ${status} → Your: ${yourAns}   Correct: ${corrAns}\n`;
  });
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `DigitalArt_Exam_${studentName || "result"}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ──────────────────────────────────────────────
// Event Listeners
// ──────────────────────────────────────────────
startBtn.addEventListener("click", () => {
  studentName = nameInput.value.trim();
  if (!studentName) {
    alert("Please enter your name before starting.");
    return;
  }
  infoDiv.style.display = "none";
  quizDiv.style.display = "block";
  generateQuestions();
  startTimer();
});

submitBtn.addEventListener("click", () => {
  if (confirm("Are you sure you want to submit?")) {
    submitExam();
  }
});

document.getElementById("downloadBtn").addEventListener("click", downloadResult);
</script>
</body>
</html>

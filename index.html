<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RWMS - YEAR 2 FRENCH EXAM</title>
    <style>
        :root {
            --fr-blue: #002395;
            --fr-red: #ED2939;
            --fr-bg: #fdfdfd;
            --accent-green: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #2d3436;
        }

        /* Top French Ribbon */
        .fr-ribbon {
            height: 12px;
            display: flex;
            position: sticky;
            top: 0;
            z-index: 1001;
        }
        .fr-ribbon div { flex: 1; }
        .b { background: var(--fr-blue); }
        .w { background: white; }
        .r { background: var(--fr-red); }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--fr-blue); font-size: 1.8rem; margin: 0; }
        .header h2 { color: var(--fr-red); font-size: 1.3rem; margin: 10px 0; }

        /* Welcome Section */
        .welcome-box { text-align: center; }
        .input-group { margin: 25px 0; }
        input[type="text"] {
            width: 80%;
            padding: 15px;
            border: 3px solid #dfe6e9;
            border-radius: 12px;
            font-size: 1.2rem;
            text-align: center;
        }
        input[type="text"]:focus { border-color: var(--fr-blue); outline: none; }

        /* Sticky Timer */
        .timer-bar {
            position: sticky;
            top: 12px;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid #ddd;
        }
        .timer-box {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--fr-blue);
            border: 3px solid var(--fr-blue);
            padding: 5px 30px;
            border-radius: 50px;
            background: white;
        }
        .timer-low { color: var(--fr-red); border-color: var(--fr-red); animation: shake 0.5s infinite; }

        @keyframes shake { 0% {x:0;} 25% {transform:translateX(2px);} 75% {transform:translateX(-2px);} 100% {x:0;} }

        /* Questions */
        .q-card {
            margin-bottom: 30px;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #f1f2f6;
            background: #fff;
            transition: 0.3s;
        }
        .q-card:hover { border-color: var(--fr-blue); }
        .q-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; display: block;}

        .options label {
            display: block;
            padding: 12px 20px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 1.1rem;
        }
        .options input { margin-right: 15px; transform: scale(1.3); }
        .options label:hover { background: #eef2ff; border-color: #ced6e0; }
        
        /* Submit Button */
        .btn {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 18px;
            margin: 40px auto;
            border-radius: 50px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }
        #startBtn { background: var(--fr-blue); }
        #submitBtn { background: var(--accent-green); }

        .hidden { display: none; }
        .correction { color: var(--fr-blue); margin-top: 10px; font-weight: bold; display: none; }
        
        #resultArea {
            text-align: center;
            padding: 40px;
            background: #e8f8f5;
            border-radius: 20px;
            border: 3px solid var(--accent-green);
        }
    </style>
</head>
<body>

<div class="fr-ribbon"><div class="b"></div><div class="w"></div><div class="r"></div></div>

<div id="intro" class="container">
    <div class="header">
        <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
        <h2>FRENCH EXAM - YEAR 2</h2>
        <p>Term Two | 45 Minutes | 30 Questions</p>
    </div>
    <div class="welcome-box">
        <div class="input-group">
            <p><strong>Bonjour! What is your name?</strong></p>
            <input type="text" id="studentName" placeholder="Type your name here..." autocomplete="off">
        </div>
        <button id="startBtn" class="btn" onclick="beginQuiz()">Commencer (Start)</button>
    </div>
</div>

<div id="examArea" class="hidden">
    <div class="timer-bar">
        <div id="timer" class="timer-box">45:00</div>
    </div>
    <div class="container">
        <h3 id="displayStudentName" style="color: var(--fr-blue);"></h3>
        <hr>
        <form id="frenchQuiz"></form>
        <button id="submitBtn" class="btn" onclick="showResults()">Submit My Work</button>

        <div id="resultArea" class="hidden">
            <h1>Bravo!</h1>
            <p id="finalName"></p>
            <h2 id="finalScore" style="font-size: 3rem;"></h2>
            <p id="finalPercent"></p>
            <p>Look below to see the correct answers!</p>
        </div>
    </div>
</div>

<script>
const questions = [
    { q: "How do you say “My name is…” in French?", o: ["Bonjour", "Je m’appelle", "Merci", "Pardon"], a: "B" },
    { q: "What is the French word for Hello?", o: ["Bonjour", "Au revoir", "Merci", "Pardon"], a: "A" },
    { q: "When someone asks your name you can say:", o: ["Je m’appelle Paul", "Merci beaucoup", "Bonne nuit", "Pardon"], a: "A" },
    { q: "What does 'Merci' mean?", o: ["Please", "Thank you", "Sorry", "Goodbye"], a: "B" },
    { q: "What does 'S’il vous plaît' mean?", o: ["Thank you", "Please", "Sorry", "Good morning"], a: "B" },
    { q: "What does 'Pardon' mean?", o: ["Excuse me / Sorry", "Please", "Thank you", "Hello"], a: "A" },
    { q: "What does 'Au revoir' mean?", o: ["Hello", "Goodbye", "Please", "Sorry"], a: "B" },
    { q: "What is 1 in French?", o: ["Deux", "Un", "Trois", "Cinq"], a: "B" },
    { q: "What is 2 in French?", o: ["Deux", "Quatre", "Six", "Huit"], a: "A" },
    { q: "What is 3 in French?", o: ["Trois", "Sept", "Dix", "Neuf"], a: "A" },
    { q: "What is 5 in French?", o: ["Quatre", "Cinq", "Six", "Deux"], a: "B" },
    { q: "What is 10 in French?", o: ["Dix", "Huit", "Sept", "Trois"], a: "A" },
    { q: "What is Red in French?", o: ["Rouge", "Bleu", "Jaune", "Vert"], a: "A" },
    { q: "What is Blue in French?", o: ["Rouge", "Bleu", "Noir", "Rose"], a: "B" },
    { q: "What is Yellow in French?", o: ["Blanc", "Jaune", "Vert", "Rouge"], a: "B" },
    { q: "What is Head in French?", o: ["La tête", "La main", "Le pied", "Le bras"], a: "A" },
    { q: "What is Hand in French?", o: ["Le pied", "La main", "La tête", "Le bras"], a: "B" },
    { q: "What is Leg in French?", o: ["Le pied", "La jambe", "La tête", "La bouche"], a: "B" },
    { q: "What is Father in French?", o: ["Mère", "Père", "Frère", "Oncle"], a: "B" },
    { q: "What is Mother in French?", o: ["Père", "Mère", "Tante", "Cousin"], a: "B" },
    { q: "What is Brother in French?", o: ["Frère", "Sœur", "Oncle", "Tante"], a: "A" },
    { q: "What is Sister in French?", o: ["Frère", "Cousin", "Sœur", "Oncle"], a: "C" },
    { q: "What is Dog in French?", o: ["Chat", "Chien", "Oiseau", "Poisson"], a: "B" },
    { q: "What is Cat in French?", o: ["Chat", "Cheval", "Chien", "Lion"], a: "A" },
    { q: "What is Bird in French?", o: ["Poisson", "Oiseau", "Chat", "Chien"], a: "B" },
    { q: "What is Monday in French?", o: ["Mardi", "Lundi", "Jeudi", "Samedi"], a: "B" },
    { q: "What is Tuesday in French?", o: ["Mardi", "Vendredi", "Dimanche", "Jeudi"], a: "A" },
    { q: "What does Sautez mean?", o: ["Jump", "Eat", "Walk", "Dance"], a: "A" },
    { q: "What does Dansez mean?", o: ["Dance", "Jump", "Eat", "Go"], a: "A" },
    { q: "What does Manger mean?", o: ["Walk", "Eat", "Jump", "D. Carry"], a: "B" }
];

let timeLeft = 45 * 60;
let clock;

function beginQuiz() {
    const nameInput = document.getElementById('studentName').value;
    if(!nameInput) { alert("Please enter your name first!"); return; }

    document.getElementById('intro').classList.add('hidden');
    document.getElementById('examArea').classList.remove('hidden');
    document.getElementById('displayStudentName').innerText = "Student: " + nameInput;

    const form = document.getElementById('frenchQuiz');
    questions.forEach((item, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'q-card';
        qDiv.innerHTML = `
            <span class="q-text">${index + 1}. ${item.q}</span>
            <div class="options">
                ${item.o.map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    return `<label><input type="radio" name="q${index}" value="${letter}"> ${letter}. ${opt}</label>`;
                }).join('')}
            </div>
            <div id="correct-${index}" class="correction">Answer: ${item.a}</div>
        `;
        form.appendChild(qDiv);
    });

    clock = setInterval(updateTimer, 1000);
}

function updateTimer() {
    timeLeft--;
    let mins = Math.floor(timeLeft / 60);
    let secs = timeLeft % 60;
    const timerEl = document.getElementById('timer');
    timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

    if(timeLeft < 300) timerEl.classList.add('timer-low');
    if(timeLeft <= 0) showResults();
}

function showResults() {
    clearInterval(clock);
    let score = 0;
    questions.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if(selected && selected.value === item.a) score++;
        document.getElementById(`correct-${index}`).style.display = 'block';
        
        // Disable all inputs
        const radios = document.getElementsByName(`q${index}`);
        radios.forEach(r => r.disabled = true);
    });

    document.getElementById('submitBtn').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');
    document.getElementById('finalName').innerText = "Candidat: " + document.getElementById('studentName').value;
    document.getElementById('finalScore').innerText = `${score} / ${questions.length}`;
    document.getElementById('finalPercent').innerText = "Score: " + Math.round((score/questions.length)*100) + "%";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>

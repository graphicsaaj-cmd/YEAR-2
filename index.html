<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWMS - PHE EXAM (YEAR 2)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 850px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f0fff4;
            color: #2d3436;
        }

        /* Login Screen Styles */
        #login-screen {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 50px;
            border-bottom: 8px solid #27ae60;
        }
        .name-input {
            padding: 15px;
            width: 80%;
            max-width: 400px;
            border: 2px solid #27ae60;
            border-radius: 10px;
            font-size: 1.1em;
            margin: 20px 0;
            outline: none;
        }
        .start-btn {
            background: #27ae60;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            transition: 0.3s;
        }
        .start-btn:hover { background: #1e8449; }

        /* Main Content (Hidden initially) */
        #exam-container { display: none; }

        .header {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 10px solid #27ae60;
            margin-bottom: 30px;
        }
        h1 { color: #27ae60; margin: 0; font-size: 1.8em; }
        .candidate-info { color: #636e72; font-weight: bold; margin-top: 10px; font-size: 1.1em; }
        
        .timer-container {
            position: sticky;
            top: 10px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        #timer {
            background: #e74c3c;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.4em;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .question-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            border-left: 6px solid #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .options-group label {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options-group label:hover { background: #e8f5e9; }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        
        .answer-reveal {
            margin-top: 15px;
            padding: 10px;
            background: #d4edda;
            color: #155724;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            border: 1px dashed #27ae60;
        }
        
        button#submit-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 40px auto;
            font-weight: bold;
        }
        button#submit-btn:disabled { background: #b2bec3; cursor: not-allowed; }
        
        #result-display {
            display: none;
            text-align: center;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            border: 4px solid #27ae60;
            margin-top: 30px;
        }
        .final-score { font-size: 3.5em; color: #27ae60; font-weight: bold; }
        #remark { font-size: 1.2em; font-weight: bold; color: #2d3436; margin: 10px 0; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
    <p><strong>PHE EXAMINATION | YEAR 2</strong></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <h3>Student Login</h3>
    <input type="text" id="studentName" class="name-input" placeholder="Enter Your Full Name" autocomplete="off">
    <br>
    <button class="start-btn" onclick="beginExam()">Start Examination</button>
</div>

<div id="exam-container">
    <div class="header">
        <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
        <p><strong>TERM TWO EXAMINATION, 2025/2026 SESSION</strong></p>
        <div id="displayName" class="candidate-info"></div>
        <p>Class: Key Stage 1 (Year 2) | Subject: PHE</p>
        <p>Duration: 45 Minutes</p>
    </div>

    <div class="timer-container">
        <div id="timer">45:00</div>
    </div>

    <form id="pheForm"></form>

    <button id="submit-btn" onclick="gradeExam(true)">Submit My Exam</button>

    <div id="result-display">
        <h2 id="resultTitle">Exam Result</h2>
        <div class="final-score" id="scoreValue">0 / 30</div>
        <p id="percentValue" style="font-size: 1.4em;"></p>
        <p id="remark"></p>
        <p>Review the correct health habits below!</p>
    </div>
</div>

<script>
const quizData = [
    { q: "Minor games are __________ activities.", o: ["boring", "simple", "dangerous", "risky"], c: 1, t: "simple" },
    { q: "Filling the basket is played in __________.", o: ["teams", "river", "classroom", "market"], c: 0, t: "teams" },
    { q: "Fire on the mountain improves __________ skills.", o: ["sleeping", "listening", "crying", "hiding"], c: 1, t: "listening" },
    { q: "Snatch the bean bag helps improve __________.", o: ["speed", "sleeping", "hiding", "crying"], c: 0, t: "speed" },
    { q: "Minor games help us stay __________.", o: ["weak", "healthy", "dirty", "tired"], c: 1, t: "healthy" },
    { q: "Traditional dances are performed during __________.", o: ["festivals", "exams", "sleeping", "lessons"], c: 0, t: "festivals" },
    { q: "Dancing improves our __________.", o: ["balance", "laziness", "sadness", "weakness"], c: 0, t: "balance" },
    { q: "Football is played between two __________.", o: ["animals", "teams", "tables", "chairs"], c: 1, t: "teams" },
    { q: "Heading means using the __________ to hit the ball.", o: ["leg", "head", "hand", "back"], c: 1, t: "head" },
    { q: "Shooting means kicking the ball towards the __________.", o: ["door", "goal", "chair", "road"], c: 1, t: "goal" },
    { q: "Stopping the ball is also called __________.", o: ["trapping", "sleeping", "shouting", "jumping"], c: 0, t: "trapping" },
    { q: "Football helps develop __________.", o: ["laziness", "teamwork", "sadness", "fear"], c: 1, t: "teamwork" },
    { q: "Swimming is moving the body in __________.", o: ["sand", "water", "air", "dust"], c: 1, t: "water" },
    { q: "Staying on water is called __________.", o: ["running", "floating", "jumping", "hiding"], c: 1, t: "floating" },
    { q: "Running near the swimming pool is __________.", o: ["safe", "dangerous", "good", "allowed"], c: 1, t: "dangerous" },
    { q: "Swimming helps the body become __________.", o: ["weak", "strong", "lazy", "slow"], c: 1, t: "strong" },
    { q: "Rest helps the body regain __________.", o: ["weakness", "strength", "sickness", "tiredness"], c: 1, t: "strength" },
    { q: "Sleep usually happens at _________.", o: ["night", "noon", "afternoon", "morning"], c: 0, t: "night" },
    { q: "A short sleep during the day is called __________.", o: ["nap", "race", "jump", "walk"], c: 0, t: "nap" },
    { q: "Too much play without rest causes __________.", o: ["happiness", "tiredness", "strength", "health"], c: 1, t: "tiredness" },
    { q: "Good sleeping condition means sleeping in a __________ place.", o: ["dirty", "clean", "noisy", "rough"], c: 1, t: "clean" },
    { q: "We should sleep in a __________ room.", o: ["noisy", "quiet", "busy", "rough"], c: 1, t: "quiet" },
    { q: "Fresh __________ helps us sleep well.", o: ["smoke", "air", "dust", "heat"], c: 1, t: "air" },
    { q: "The sleeping place should be free from __________.", o: ["insects", "pillows", "beds", "chairs"], c: 0, t: "insects" },
    { q: "Noise can __________ sleep.", o: ["improve", "disturb", "help", "strengthen"], c: 1, t: "disturb" },
    { q: "Fear and worry can affect our __________.", o: ["toys", "sleep", "books", "games"], c: 1, t: "sleep" },
    { q: "Mosquitoes can __________ sleep.", o: ["improve", "disturb", "clean", "help"], c: 1, t: "disturb" },
    { q: "Rest helps the __________ work properly.", o: ["brain", "shoes", "bag", "cloth"], c: 0, t: "brain" },
    { q: "Sleeping early is a good sleeping __________.", o: ["habit", "game", "noise", "play"], c: 0, t: "habit" },
    { q: "Rest prevents __________.", o: ["strength", "tiredness", "happiness", "joy"], c: 1, t: "tiredness" }
];

let candidateName = "";
let clock;

function beginExam() {
    const nameBox = document.getElementById('studentName');
    if (nameBox.value.trim() === "") {
        alert("Please enter your name to start the exam.");
        return;
    }
    candidateName = nameBox.value.trim();
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('exam-container').style.display = 'block';
    document.getElementById('displayName').innerText = "Candidate Name: " + candidateName;
    startTimer();
}

const form = document.getElementById('pheForm');
quizData.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'question-card';
    div.innerHTML = `
        <h3>${i + 1}. ${item.q}</h3>
        <div class="options-group">
            ${item.o.map((opt, idx) => `
                <label><input type="radio" name="p${i}" value="${idx}"> ${String.fromCharCode(65 + idx)}. ${opt}</label>
            `).join('')}
        </div>
        <div class="answer-reveal" id="ans-${i}">Correct Answer: "${item.t}"</div>
    `;
    form.appendChild(div);
});

function startTimer() {
    let timeLeft = 45 * 60;
    const timerEl = document.getElementById('timer');
    clock = setInterval(() => {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        if (timeLeft <= 0) {
            clearInterval(clock);
            gradeExam(false); // Auto-submit when time is up
        }
        timeLeft--;
    }, 1000);
}

function gradeExam(isManual) {
    if (isManual) {
        if (!confirm("Are you sure you want to submit your exam?")) return;
    }

    clearInterval(clock);
    document.getElementById('submit-btn').disabled = true;
    let score = 0;

    quizData.forEach((item, i) => {
        const selected = document.querySelector(`input[name="p${i}"]:checked`);
        document.getElementById(`ans-${i}`).style.display = 'block';
        if (selected && parseInt(selected.value) === item.c) {
            score++;
        }
    });

    const percent = Math.round((score / 30) * 100);
    let remark = "";
    if (percent >= 80) remark = "Remark: Excellent! 🌟";
    else if (percent >= 60) remark = "Remark: Very Good! 👍";
    else if (percent >= 40) remark = "Remark: Good Effort! 😊";
    else remark = "Remark: Keep Studying! 📚";

    document.getElementById('result-display').style.display = 'block';
    document.getElementById('resultTitle').innerText = candidateName + ", your result is ready:";
    document.getElementById('scoreValue').innerText = `${score} / 30`;
    document.getElementById('percentValue').innerText = "Grade: " + percent + "%";
    document.getElementById('remark').innerText = remark;
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>

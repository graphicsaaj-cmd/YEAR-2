<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Wunderkind Model School - Year 2 Math Exam</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 20px auto; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #002060; }
        .timer { font-size: 20px; color: red; font-weight: bold; text-align: center; position: sticky; top: 0; background: #fff; padding: 10px; border-bottom: 2px solid #ccc; z-index: 10; }
        .question { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .options label { display: block; margin: 5px 0; cursor: pointer; }
        .correct { color: green; font-weight: bold; background: #e8f5e9; padding: 5px; border-radius: 3px; }
        .wrong { color: red; font-weight: bold; background: #ffebee; padding: 5px; border-radius: 3px; }
        button { padding: 10px 20px; cursor: pointer; background: #002060; color: white; border: none; border-radius: 5px; width: 100%; font-size: 16px; }
        #quiz-screen, #result-screen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
        <h2>TERM THREE EXAMINATION (2025/2026)</h2>
        <p><strong>Class:</strong> Key Stage 1 (Year 2)</p>
        <input type="text" id="student-name" placeholder="Enter Your Full Name" style="width: 95%; padding: 10px; margin: 20px 0;">
        <button onclick="startExam()">Start Examination</button>
    </div>

    <div id="quiz-screen">
        <div id="timer" class="timer">Time Remaining: 30:00</div>
        <form id="exam-form"></form>
        <button onclick="submitExam()">Submit Examination</button>
    </div>

    <div id="result-screen">
        <h2>Examination Results</h2>
        <div id="score-display"></div>
        <div id="corrections"></div>
    </div>
</div>

<script>
    const questions = [
        { q: "A school starts at 8:00 a.m. and closes at 2:00 p.m. How many hours is the school open?", opt: ["4 hours", "5 hours", "6 hours", "7 hours"], ans: 2 },
        { q: "What is the digital form of the time shown as 3 o'clock?", opt: ["3:30", "3:00", "12:03", "30:00"], ans: 1 },
        { q: "Half past 7 means:", opt: ["7:15", "7:00", "7:45", "7:30"], ans: 3 },
        { q: "Which container can hold the most water?", opt: ["Cup", "Spoon", "Bucket", "Bottle cap"], ans: 2 },
        { q: "Which shape has 4 equal sides?", opt: ["Triangle", "Circle", "Square", "Oval"], ans: 2 },
        { q: "Which of these is a three-dimensional (3D) shape?", opt: ["Rectangle", "Triangle", "Cube", "Square"], ans: 2 },
        { q: "Which shape can roll easily?", opt: ["Cube", "Cuboid", "Sphere", "Rectangle"], ans: 2 },
        { q: "A table top covers more space than a book. The table top has a:", opt: ["Smaller area", "Larger area", "Equal area", "No area"], ans: 1 },
        { q: "The number of pupils who like football in a class is an example of:", opt: ["Weight", "Capacity", "Statistics", "Time"], ans: 2 },
        { q: "Which is lighter?", opt: ["Car", "Bicycle", "Truck", "Bus"], ans: 1 },
        { q: "Which is heavier?", opt: ["Feather", "Cotton wool", "Stone", "Leaf"], ans: 2 },
        { q: "Statistics help us compare:", opt: ["Information", "Weight only", "Time only", "Shapes only"], ans: 0 },
        { q: "Which shape looks like a ball?", opt: ["Cube", "Sphere", "Rectangle", "Triangle"], ans: 1 },
        { q: "How many days are in January?", opt: ["28", "29", "30", "31"], ans: 3 },
        { q: "8 × 9 =", opt: ["56", "72", "84", "74"], ans: 1 },
        { q: "289 + 346 =", opt: ["636", "645", "635", "645"], ans: 1 },
        { q: "____ + 175 = 205", opt: ["30", "35", "40", "45"], ans: 0 },
        { q: "635 - 455 =", opt: ["230", "190", "195", "180"], ans: 3 },
        { q: "½ of 30 is", opt: ["20", "15", "25", "10"], ans: 1 },
        { q: "45 divided by 5 =", opt: ["9", "10", "8", "7"], ans: 0 }
    ];

    let timeLeft = 30 * 60;
    let timerInterval;

    function startExam() {
        if(!document.getElementById('student-name').value) return alert("Please enter your name.");
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        const form = document.getElementById('exam-form');
        questions.forEach((item, index) => {
            let html = `<div class="question"><p>${index + 1}. ${item.q}</p><div class="options">`;
            item.opt.forEach((o, i) => {
                html += `<label><input type="radio" name="q${index}" value="${i}"> ${o}</label>`;
            });
            html += `</div><div id="feed${index}"></div></div>`;
            form.innerHTML += html;
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft % 60;
            document.getElementById('timer').innerText = `Time Remaining: ${m}:${s < 10 ? '0'+s : s}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    function submitExam() {
        clearInterval(timerInterval);
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const feedback = document.getElementById(`feed${index}`);
            if (selected && parseInt(selected.value) === item.ans) {
                score++;
                feedback.innerHTML = '<p class="correct">Correct!</p>';
            } else {
                feedback.innerHTML = `<p class="wrong">Wrong. Correct answer: ${item.opt[item.ans]}</p>`;
            }
        });
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('score-display').innerHTML = `<h3>Final Score: ${score} / ${questions.length}</h3>`;
    }
</script>
</body>
</html>

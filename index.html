<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWMS - SOCIAL & CITIZENSHIP STUDIES (YEAR 2)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 850px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .header-panel {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-top: 8px solid #673ab7;
        }
        h1 { color: #4527a0; margin: 0; font-size: 1.7em; }
        
        .student-info {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border: 1px solid #ddd;
        }
        .student-info input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 90%;
        }

        .timer-bar {
            position: sticky;
            top: 10px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        #timer {
            font-size: 1.4em;
            font-weight: bold;
            color: white;
            background: #d32f2f;
            padding: 10px 40px;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        .q-card {
            margin-bottom: 20px;
            padding: 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            border-left: 6px solid #673ab7;
        }
        .q-card h3 { margin-top: 0; color: #311b92; font-size: 1.1em; }

        .options label {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options label:hover { background: #f3e5f5; border-color: #673ab7; }
        .options input { margin-right: 12px; transform: scale(1.3); }

        .correct-reveal {
            margin-top: 12px;
            padding: 10px;
            background: #e8f5e9;
            border: 1px dashed #2e7d32;
            border-radius: 6px;
            color: #1b5e20;
            font-weight: bold;
            display: none; 
        }

        #submitBtn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 40px auto;
            padding: 18px;
            font-size: 1.2em;
            background: #673ab7;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #submitBtn:hover { background: #5e35b1; }

        .results-overlay {
            display: none;
            text-align: center;
            background: #fff;
            padding: 40px;
            border: 5px solid #673ab7;
            border-radius: 20px;
            margin-top: 30px;
        }
        .score-big { font-size: 4em; color: #2e7d32; display: block; font-weight: 800; }
    </style>
</head>
<body>

<div class="header-panel">
    <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
    <p><strong>TERM TWO EXAMINATION, 2025/2026 ACADEMIC SESSION</strong></p>
    <p>Class: Key Stage 1 (Year 2) | Subject: Social & Citizenship Studies</p>
</div>

<div class="student-info">
    <div>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter full name...">
    </div>
    <div>
        <label>Date:</label><br>
        <input type="date">
    </div>
</div>

<div class="timer-bar">
    <div id="timer">45:00</div>
</div>

<form id="socialForm"></form>

<button type="button" id="submitBtn" onclick="gradeCBT()">Submit Final Answers</button>

<div id="resultsOverlay" class="results-overlay">
    <h2>Examination Finished</h2>
    <span id="finalScore" class="score-big">0 / 30</span>
    <p id="gradeComment" style="font-size: 1.4em; color: #555;"></p>
    <p>Review your answers below. Correct choices are highlighted.</p>
</div>

<script>
const questions = [
    { q: "Greeting is a way of showing ______.", o: ["anger", "respect", "punishment", "fighting"], c: 1, a: "respect" },
    { q: "Greeting elders shows good ______.", o: ["manners", "fighting", "shouting", "noise"], c: 0, a: "manners" },
    { q: "The Hausa people live mainly in the ______ part of Nigeria.", o: ["eastern", "northern", "western", "southern"], c: 1, a: "northern" },
    { q: "“Ututu oma” is an Igbo greeting for ______.", o: ["morning", "evening", "afternoon", "night"], c: 0, a: "morning" },
    { q: "Greeting helps us make ______.", o: ["enemies", "friends", "noise", "quarrel"], c: 1, a: "friends" },
    { q: "Substances are things we take into our ______.", o: ["house", "body", "bag", "pocket"], c: 1, a: "body" },
    { q: "Food gives us ______.", o: ["sleep", "strength", "sickness", "weakness"], c: 1, a: "strength" },
    { q: "Smoking is ______ for our health.", o: ["good", "helpful", "harmful", "safe"], c: 2, a: "harmful" },
    { q: "We should take substances only from ______ adults.", o: ["unknown", "trusted", "angry", "careless"], c: 1, a: "trusted" },
    { q: "We should not eat in ______ places.", o: ["clean", "dirty", "safe", "good"], c: 1, a: "dirty" },
    { q: "Overdose means taking too ______.", o: ["little", "much", "slow", "small"], c: 1, a: "much" },
    { q: "Too much alcohol can lead to ______.", o: ["wisdom", "intoxication", "peace", "happiness"], c: 1, a: "intoxication" },
    { q: "Smoke can damage the ______.", o: ["legs", "lungs", "hair", "hands"], c: 1, a: "lungs" },
    { q: "Choking makes it hard to ______.", o: ["breathe", "sleep", "walk", "laugh"], c: 0, a: "breathe" },
    { q: "A person suffering from overdose should be taken to the ______.", o: ["market", "hospital", "playground", "farm"], c: 1, a: "hospital" },
    { q: "A clean environment is free from ______.", o: ["dirt", "water", "people", "trees"], c: 0, a: "dirt" },
    { q: "Refuse should be thrown into a ______.", o: ["bag", "dustbin", "pocket", "plate"], c: 1, a: "dustbin" },
    { q: "Dirty surroundings can cause ______.", o: ["wealth", "joy", "diseases", "laughter"], c: 2, a: "diseases" },
    { q: "A sanitary inspector helps to keep the environment ______.", o: ["clean", "noisy", "dark", "rough"], c: 0, a: "clean" },
    { q: "Stagnant water can cause ______.", o: ["sickness", "happiness", "strength", "laughter"], c: 0, a: "sickness" },
    { q: "A broom is used for ______.", o: ["cooking", "sweeping", "writing", "washing"], c: 1, a: "sweeping" },
    { q: "A rake is used to gather ______.", o: ["water", "refuse", "books", "clothes"], c: 1, a: "refuse" },
    { q: "A cutlass is used to cut ______.", o: ["grass", "paper", "plates", "bread"], c: 0, a: "grass" },
    { q: "A dustpan is used to collect ______.", o: ["smoke", "dirt", "water", "grass"], c: 1, a: "dirt" },
    { q: "Food is anything we ______ or drink.", o: ["throw", "eat", "break", "hide"], c: 1, a: "eat" },
    { q: "Eggs are ______ foods.", o: ["protective", "body-building", "metal", "sand"], c: 1, a: "body-building" },
    { q: "Fruits and vegetables are ______ foods.", o: ["energy", "protective", "metal", "sand"], c: 1, a: "protective" },
    { q: "Fish can be gotten from the ______.", o: ["sky", "river", "road", "school"], c: 1, a: "river" },
    { q: "We eat food to stay ______.", o: ["sick", "healthy", "tired", "weak"], c: 1, a: "healthy" },
    { q: "Accidents can cause ______.", o: ["happiness", "injury", "laughter", "reward"], c: 1, a: "injury" }
];

const form = document.getElementById('socialForm');
questions.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'q-card';
    div.innerHTML = `
        <h3>${i + 1}. ${item.q}</h3>
        <div class="options">
            ${item.o.map((opt, idx) => `
                <label><input type="radio" name="sq${i}" value="${idx}"> ${String.fromCharCode(97 + idx)}) ${opt}</label>
            `).join('')}
        </div>
        <div class="correct-reveal" id="ans-${i}">Correct Answer: ${item.a}</div>
    `;
    form.appendChild(div);
});

let time = 45 * 60;
const timerDisplay = document.getElementById('timer');
const clock = setInterval(() => {
    let m = Math.floor(time / 60);
    let s = time % 60;
    timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    if (time <= 0) { clearInterval(clock); gradeCBT(); }
    time--;
}, 1000);

function gradeCBT() {
    clearInterval(clock);
    document.getElementById('submitBtn').style.display = 'none';
    let score = 0;
    questions.forEach((item, i) => {
        const selected = document.querySelector(`input[name="sq${i}"]:checked`);
        document.getElementById(`ans-${i}`).style.display = 'block';
        if (selected && parseInt(selected.value) === item.c) score++;
    });
    document.getElementById('resultsOverlay').style.display = 'block';
    document.getElementById('finalScore').innerText = `${score} / 30`;
    document.getElementById('gradeComment').innerText = `You scored ${Math.round((score/30)*100)}%`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
